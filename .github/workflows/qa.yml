name: QA

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LAB_URL: http://localhost:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start preview and reference servers
        shell: bash
        run: |
          npm run preview > /tmp/bevalk-preview.log 2>&1 &
          echo $! > /tmp/bevalk-preview.pid
          node handoff/reference/serve.js 8765 > /tmp/bevalk-reference.log 2>&1 &
          echo $! > /tmp/bevalk-reference.pid

          wait_for_url() {
            local url="$1"
            local name="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --max-time 2 "$url" > /dev/null 2>&1; then
                echo "$name is responding at $url"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name at $url"
            cat /tmp/bevalk-preview.log || true
            cat /tmp/bevalk-reference.log || true
            return 1
          }

          wait_for_url "http://localhost:4173/" "Vite preview"
          wait_for_url "http://localhost:8765/project/Main.dc.html" "Reference server"

      - name: E2E
        run: npm run e2e

      - name: E2E baseline
        run: npm run e2e:baseline

      - name: Invariants
        run: npm run invariants

      - name: Sweep
        run: npm run sweep

      - name: Accessibility
        run: npm run a11y

      - name: Focus order
        run: npm run focus

      - name: Capture visual baseline
        run: npm run visual:baseline

      - name: Visual comparison
        run: npm run visual

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-diagnostics
          if-no-files-found: ignore
          path: |
            tests/visual/diff/
            tests/e2e/results/

      - name: Upload visual comparison summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-comparison-summary
          path: tests/visual/diff/comparison-summary.json
