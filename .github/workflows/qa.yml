name: QA

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LAB_URL: http://localhost:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          files=""

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if files=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
              if [[ -n "$files" ]] && ! printf '%s\n' "$files" | grep -Ev '^(tasks/|.*\.md$)' >/dev/null; then
                code=false
              fi
            else
              code=true
            fi
          fi

          echo "Changed files:"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
          else
            echo "(empty)"
          fi
          echo "Run code checks: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Install Chromium and system dependencies
        if: steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Type check
        if: steps.changes.outputs.code == 'true'
        run: npx tsc --noEmit -p .

      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Middleware ESM
        if: steps.changes.outputs.code == 'true'
        run: npm run check-middleware-esm

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Start preview and reference servers
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          npm run preview > /tmp/bevalk-preview.log 2>&1 &
          echo $! > /tmp/bevalk-preview.pid
          node tools/serve-reference.cjs 8765 > /tmp/bevalk-reference.log 2>&1 &
          echo $! > /tmp/bevalk-reference.pid

          wait_for_url() {
            local url="$1"
            local name="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --max-time 2 "$url" > /dev/null 2>&1; then
                echo "$name is responding at $url"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name at $url"
            cat /tmp/bevalk-preview.log || true
            cat /tmp/bevalk-reference.log || true
            return 1
          }

          wait_for_url "http://localhost:4173/" "Vite preview"
          wait_for_url "http://localhost:8765/project/Main.dc.html" "Reference server"

      - name: E2E
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e

      - name: E2E baseline
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e:baseline

      - name: Invariants
        if: steps.changes.outputs.code == 'true'
        run: npm run invariants

      - name: Sweep
        if: steps.changes.outputs.code == 'true'
        run: npm run sweep

      - name: Accessibility
        if: steps.changes.outputs.code == 'true'
        run: npm run a11y

      - name: Focus order
        if: steps.changes.outputs.code == 'true'
        run: npm run focus

      - name: Select dropdowns
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e:select

      - name: Capture visual baseline
        if: steps.changes.outputs.code == 'true'
        run: npm run visual:baseline

      - name: Visual comparison
        if: steps.changes.outputs.code == 'true'
        run: npm run visual

      - name: Own visual (dropdowns)
        if: steps.changes.outputs.code == 'true'
        run: npm run visual:own

      - name: Upload own visual artifacts
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-own-visual
          if-no-files-found: ignore
          path: |
            tests/visual/own/current/
            tests/visual/own/diff/

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-diagnostics
          if-no-files-found: ignore
          path: |
            tests/visual/diff/
            tests/e2e/results/

      - name: Upload visual comparison summary
        if: success() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-comparison-summary
          path: tests/visual/diff/comparison-summary.json
