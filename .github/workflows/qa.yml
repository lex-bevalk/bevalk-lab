name: QA

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LAB_URL: http://localhost:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          ui=false
          files=""

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if files=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
              if [[ -n "$files" ]] && ! printf '%s\n' "$files" | grep -Ev '^(tasks/|.*\.md$)' >/dev/null; then
                code=false
              fi
              if printf '%s\n' "$files" | grep -Eq '^(src/ui/|src/styles/|src/logic/|src/data/|design/|index\.html$|vite\.config\.ts$|package-lock\.json$|tests/visual/)'; then
                ui=true
              fi
            else
              code=true
              ui=true
            fi
          else
            ui=true
          fi

          echo "Changed files:"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
          else
            echo "(empty)"
          fi
          echo "Run code checks: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Run visual smoke: $ui"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Install Chromium and system dependencies
        if: steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Type check
        if: steps.changes.outputs.code == 'true'
        run: npx tsc --noEmit -p .

      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Middleware ESM
        if: steps.changes.outputs.code == 'true'
        run: npm run check-middleware-esm

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Start preview and reference servers
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          npm run preview > /tmp/bevalk-preview.log 2>&1 &
          echo $! > /tmp/bevalk-preview.pid
          mkdir -p tests/e2e/results
          node tools/serve-reference.cjs 8765 > tests/e2e/results/reference-server.log 2>&1 &
          echo $! > /tmp/bevalk-reference.pid

          wait_for_url() {
            local url="$1"
            local name="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error --max-time 2 "$url" > /dev/null 2>&1; then
                echo "$name is responding at $url"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name at $url"
            cat /tmp/bevalk-preview.log || true
            cat tests/e2e/results/reference-server.log || true
            return 1
          }

          wait_for_url "http://localhost:4173/" "Vite preview"
          wait_for_url "http://localhost:8765/project/Main.dc.html" "Reference server"

      - name: E2E
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e

      - name: E2E family layout
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e:family-layout

      - name: Invariants
        if: steps.changes.outputs.code == 'true'
        run: npm run invariants

      - name: Sweep
        if: steps.changes.outputs.code == 'true'
        run: npm run sweep

      - name: Accessibility
        if: steps.changes.outputs.code == 'true'
        run: npm run a11y

      - name: Focus order
        if: steps.changes.outputs.code == 'true'
        run: npm run focus

      - name: Review and comments
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e:review

      - name: Select dropdowns
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e:select

      - name: Visual smoke
        id: visual-smoke
        if: steps.changes.outputs.ui == 'true'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'cambio-visual') }}
        env:
          BASE_REF: ${{ github.base_ref }}
          LAB_URL: http://localhost:4173/
        run: npm run visual:smoke

      - name: Upload visual smoke diffs
        if: always() && steps.changes.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-smoke
          if-no-files-found: ignore
          path: |
            tests/visual/smoke-diff/

      - name: Summarize visual smoke
        if: always() && steps.changes.outputs.ui == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const path = 'tests/visual/smoke-diff/comparison-summary.json';
          if (!fs.existsSync(path)) {
            console.log('## Visual smoke\n\nNo se generó el resumen. Revisa el log del paso Visual smoke.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`## Visual smoke\n\n${report.compared} pares · ${report.pass} PASS · ${report.fail} FAIL · ${report.missing} faltan.`);
          const smokePath = 'tests/visual/smoke-diff/smoke-summary.json';
          if (fs.existsSync(smokePath)) {
            const smoke = JSON.parse(fs.readFileSync(smokePath, 'utf8'));
            console.log(`\nTokens de color distintos: ${smoke.tokenDifferences.length}${smoke.tokenDifferences.length ? ` (${smoke.tokenDifferences.map(item => item.name).join(', ')})` : ''}.`);
          }
          console.log('\n| Captura | Diferencia | PNG diff |\n|---|---:|---|');
          for (const item of report.results) console.log(`| ${item.name} | ${item.percent?.toFixed(3) ?? '—'}% | \`${item.currentName ? `tests/visual/smoke-diff/${item.currentName}` : '—'}\` |`);
          NODE

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-diagnostics
          if-no-files-found: ignore
          path: |
            tests/visual/diff/
            tests/e2e/results/
